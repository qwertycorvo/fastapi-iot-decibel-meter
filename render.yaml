services:
  # Backend service
  - type: web
    name: decibel-meter-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false # Set this in Render Dashboard for Supabase
      - key: PYTHON_VERSION
        value: 3.10.0

  # Frontend service
  - type: web
    name: decibel-meter-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./build
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          type: web
          name: decibel-meter-backend
          property: host
